<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitry – vanetracker</title>
<link rel="icon" href="icons/icon-192.png">
<script>if(!matchMedia('(min-width: 760px)').matches) location.replace('index.html?app');</script>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(1100px 700px at 50% 30%,#dff3e4 0%,#f4f6f3 60%) fixed;color:#15201a;font-family:Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:390px;height:844px;transform-origin:center;border-radius:58px;padding:14px;background:#111;box-shadow:0 0 0 2px #2a2e2b,0 0 0 9px #1a1d1b,0 40px 100px rgba(20,60,30,.35);position:relative;flex:none}
.phone:before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:2}
.phone iframe{width:100%;height:100%;border:0;border-radius:44px;background:#f4f6f3}
</style>
</head>
<body>
<div class="phone"><iframe src="index.html?app" title="Habitry app"></iframe></div>
<script>
// Skalér hele telefonen, så den fylder skærmens højde
function fit(){ var s = Math.min((innerHeight - 40) / 862, (innerWidth - 40) / 408); document.querySelector('.phone').style.transform = 'scale(' + s + ')'; }
fit(); addEventListener('resize', fit);
</script>
</body>
</html>
