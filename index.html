<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habitry">
<script>
(function(){
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var desktop = matchMedia('(min-width: 760px) and (hover: hover) and (pointer: fine)').matches;
  var framed = window.self !== window.top;
  if(framed) document.documentElement.classList.add('framed');
  if(desktop && !standalone && !framed && location.protocol.indexOf('http')===0 && !/[?&]app/.test(location.search)) location.replace('desktop.html');
})();
</script>
<title>Habitry – habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f6; --card:#ffffff; --ink:#111613; --ink2:#4f5752; --muted:#8a918c; --line:#e6e9e7; --soft:#f0f2f0;
  --a1:#e4f3e8; --a2:#b2dfbe; --a3:#6cc184; --a4:#2f9a4f; --a5:#1c6e35; --accent:#2f9a4f; --accentInk:#fff;
  --miss:#fbe6e3; --missInk:#b2392b; --gold:#d99a00;
  --r:16px;
}
[data-theme="ocean"]{ --a1:#e2eefb; --a2:#a9cdf2; --a3:#5aa2e3; --a4:#2a78d6; --a5:#1a4f93; --accent:#2a78d6; }
[data-theme="sunset"]{ --a1:#fdede2; --a2:#f8c6a0; --a3:#f19758; --a4:#e06a2a; --a5:#a8461a; --accent:#e06a2a; }
[data-theme="lavender"]{ --a1:#eeebfb; --a2:#cbc3f3; --a3:#9a8de6; --a4:#6250d6; --a5:#433597; --accent:#6250d6; }
[data-theme="dark"]{
  --bg:#0f1210; --card:#181c19; --ink:#eef1ee; --ink2:#b5bdb7; --muted:#7a837c; --line:#272d29; --soft:#1f2420;
  --a1:#1c3524; --a2:#255c37; --a3:#2f8a4d; --a4:#45b066; --a5:#7ad693; --accent:#45b066; --accentInk:#0b120d;
  --miss:#3a2220; --missInk:#f08f80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));min-height:100vh}
.framed .app{padding-top:56px}
header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.hello{font-size:24px;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pill svg.i{width:15px;height:15px}
.pill.gold{background:var(--ink);color:var(--card);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
h2{font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.2px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:22px 4px 8px;display:flex;justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
/* Progress */
.hero{display:flex;gap:18px;align-items:center}
.ring{width:72px;height:72px;flex:none}
.hero .big{font-size:22px;font-weight:700;letter-spacing:-.3px}
.streakline{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--ink2);font-weight:500}
.streakline svg.i{width:16px;height:16px;color:#e06a2a}
/* Habits */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.habit{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.hinfo{flex:1;min-width:0}
.hname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit.done .hname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.hmeta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;margin-top:2px;align-items:center}
.hmeta span{display:inline-flex;align-items:center;gap:4px}
.hmeta svg.i{width:13px;height:13px}
.check{width:32px;height:32px;border-radius:50%;border:1.8px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;transition:.15s;padding:0}
.check svg.i{opacity:0;color:var(--accentInk);width:16px;height:16px;stroke-width:2.6}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg.i{opacity:1}
.check:active{transform:scale(.9)}
.edit{border:0;background:none;color:var(--muted);padding:4px;display:grid;place-items:center}
.empty{color:var(--muted);font-size:14px;padding:14px 16px}
.addbtn{width:100%;border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:14px;font-weight:600;color:var(--ink2);margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.iconbtn{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;padding:0}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:9px;border:0;background:var(--soft);font-size:13px;font-weight:600;display:grid;place-items:center;position:relative;color:var(--ink2);padding:0}
.day.blank{background:transparent}
.day.l1{background:var(--a1);color:var(--a5)} .day.l2{background:var(--a2);color:var(--a5)}
.day.l3{background:var(--a3);color:#fff} .day.l4{background:var(--a4);color:#fff}
[data-theme="dark"] .day.l3,[data-theme="dark"] .day.l4{color:#0b120d}
.day.miss{background:var(--miss);color:var(--missInk)}
.day.future{background:transparent;color:var(--muted);opacity:.6}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* Stats */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .b{width:100%;max-width:30px;background:var(--a3);border-radius:4px 4px 0 0;min-height:2px}
.bar.worst .b{background:var(--missInk)}
.bar .v{font-size:11px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.bar .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--miss);color:var(--missInk);border-radius:12px;padding:12px;font-size:14px;margin-top:14px;line-height:1.45}
.insight.good{background:var(--a1);color:var(--a5)}
.insight svg.i{width:18px;height:18px;margin-top:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0}
.kpi{padding:16px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi b{font-size:22px;display:block;font-weight:700;letter-spacing:-.3px}
.kpi span{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:13px;margin:10px 0}
.hbar .track{background:var(--soft);border-radius:4px;height:10px;overflow:hidden}
.hbar .fill{height:100%;background:var(--a4);border-radius:0 4px 4px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hbar b{text-align:right;font-weight:600}
.locked{position:relative}
.locked .blur{filter:blur(5px);pointer-events:none;user-select:none}
.locked .lockmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:8px;z-index:60;display:none;white-space:nowrap}
/* Badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:12px}
.badge{text-align:center;font-size:11.5px;color:var(--muted)}
.badge .ic{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;border:1.5px dashed var(--line);color:var(--muted)}
.badge.got{color:var(--ink2)}
.badge.got .ic{border:0;background:var(--a1);color:var(--a5)}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom));font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--ink)}
nav button.on svg.i{stroke-width:2.2}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:19px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
input[type=text],input[type=time],input[type=email],input[type=password]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--ink2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 6px;font-weight:500;font-size:13px;min-width:38px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.colors{display:flex;gap:10px}
.colors button{width:30px;height:30px;border-radius:50%;border:0;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.primary{width:100%;border:0;background:var(--ink);color:var(--card);padding:14px;border-radius:12px;font-weight:600;font-size:15px;margin-top:20px}
.primary:disabled{opacity:.5}
.secondary{width:100%;border:1px solid var(--line);background:var(--card);padding:13px;border-radius:12px;font-weight:600;font-size:15px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.ghost{width:100%;border:0;background:none;color:var(--muted);padding:10px;font-weight:500;margin-top:6px}
.danger{color:var(--missInk)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;background:var(--card);position:relative}
.plan.on{border-color:var(--ink)}
.plan b{font-size:21px;display:block;margin:2px 0;letter-spacing:-.3px}
.plan .save{position:absolute;top:-9px;right:10px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.feat{list-style:none;padding:0;margin:14px 0 0}
.feat li{padding:7px 0;display:flex;gap:10px;font-size:15px;align-items:center}
.feat svg.i{color:var(--accent);width:18px;height:18px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.th{border:1.5px solid var(--line);border-radius:12px;padding:6px;background:var(--card);font-size:11.5px;font-weight:500;position:relative;color:var(--ink2)}
.th.on{border-color:var(--ink);color:var(--ink)}
.th .sw{height:30px;border-radius:7px;margin-bottom:5px}
.th .lk{position:absolute;top:9px;right:9px;color:#fff}
.th .lk svg.i{width:13px;height:13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:15px;gap:10px}
.row:first-of-type{border-top:0}
.row .k{color:var(--ink2)}
.link{border:0;background:none;padding:0;font-weight:600}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--a1);color:var(--a5);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
/* Widget preview */
.phone{background:linear-gradient(160deg,#c9d6e8,#e2d3e2);border-radius:20px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wdg{background:rgba(255,255,255,.92);border-radius:18px;padding:12px;color:#111613;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between}
.wdg.wide{grid-column:span 2;aspect-ratio:auto}
.wdg .t{font-size:10.5px;font-weight:600;color:#8a918c;text-transform:uppercase;letter-spacing:.6px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini i{aspect-ratio:1;border-radius:3px;background:#e6e9e7}
/* Auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.3px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff}
.auth h1{font-size:28px;letter-spacing:-.6px;margin:34px 0 6px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-top:24px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--missInk);font-size:13.5px;margin-top:12px;min-height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(calc(-100% - 80px));visibility:hidden;background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:70;transition:.25s;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.framed .toast{top:56px}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.confetti{position:fixed;top:-10px;width:7px;height:11px;z-index:80;pointer-events:none;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.5}}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
table.tbl{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}
table.tbl td,table.tbl th{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-weight:500}
table.tbl td:first-child,table.tbl th:first-child{text-align:left}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;margin-top:12px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
.cmp td,.cmp th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center;font-weight:500}
.cmp th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--ink2)}
.spin{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="root"><div class="spin">Loading…</div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
(() => {
// ================= constants =================
const FREE_LIMIT = 3;
const PARTS = [
  {id:'morning', name:'Morning', ic:'sunrise'},
  {id:'afternoon', name:'Afternoon', ic:'sun'},
  {id:'evening', name:'Evening', ic:'moon'}
];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// Habit identity colors – fixed order, assigned on creation
const COLORS = ['#2a78d6','#eb6834','#1baf7a','#d99a00','#e87ba4','#6250d6'];
const THEMES = [
  {id:'forest', name:'Forest', sw:'#2f9a4f', free:true},
  {id:'ocean', name:'Ocean', sw:'#2a78d6'},
  {id:'sunset', name:'Sunset', sw:'#e06a2a'},
  {id:'lavender', name:'Lavender', sw:'#6250d6'},
  {id:'dark', name:'Dark', sw:'#181c19'}
];
const BADGES = [
  {n:3, t:'3-day streak'}, {n:7, t:'1 week'}, {n:14, t:'2 weeks'}, {n:30, t:'30 days'},
  {n:60, t:'60 days'}, {n:100, t:'100 days'}, {tot:50, t:'50 check-ins'}, {tot:250, t:'250 check-ins'}
];
const SUGGESTIONS = [
  {name:'Drink water', part:'morning', time:'08:00'},
  {name:'Read 20 pages', part:'evening', time:'21:00'},
  {name:'Exercise 30 min', part:'afternoon', time:'17:00'},
  {name:'Meditate', part:'morning', time:'07:30'},
  {name:'No phone in bed', part:'evening', time:'22:30'}
];

// ================= icons =================
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  sunrise:'<path d="M12 2v6M5.2 10.2l1.4 1.4M2 18h2M20 18h2M17.4 11.6l1.4-1.4M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  today:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/>',

async function hash(s){
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('habitry:'+s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  } catch(e){ let h=0; for(const c of 'habitry:'+s) h=(h*31+c.charCodeAt(0))|0; return 'x'+h; }
}

function demoState(){
  const t = today(), created = key(addDays(t,-70));
  const s = blankState('Alex');
  s.habits = [
    {id:'h1', name:'Drink 2 liters of water', color:COLORS[0], part:'morning', time:'08:00', days:[0,1,2,3,4,5,6], created},
    {id:'h2', name:'Exercise 30 min', color:COLORS[1], part:'afternoon', time:'16:30', days:[0,2,4,5], created},
    {id:'h3', name:'Read 20 pages', color:COLORS[2], part:'evening', time:'21:00', days:[0,1,2,3,4,5,6], created}
  ];
  // Deterministic history: weak Mondays, Friday evenings and Sunday afternoons
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for(let i=70;i>=1;i--){
    const d = addDays(t,-i), w = dowIdx(d), done = [];
    s.habits.forEach(h => {
      if(!h.days.includes(w)) return;
      let p = .86;
      if(w===0) p = .48;
      if(w===4 && h.part==='evening') p = .4;
      if(w===6 && h.part==='afternoon') p = .55;
      if(i<=12) p = Math.min(.97, p+.25);
      if(rnd() < p) done.push(h.id);
    });
    if(done.length) s.log[key(d)] = done;
  }
  s.earned = [0,1,6];
  return s;
}

// ================= habit logic =================
const isDone = (h,k) => (S.log[k]||[]).includes(h.id);
const scheduled = (h,d) => h.days.includes(dowIdx(d)) && key(d) >= h.created;
function toggle(h,k){
  const arr = S.log[k] || (S.log[k] = []);
  const i = arr.indexOf(h.id);
  if(i>=0) arr.splice(i,1); else arr.push(h.id);
  if(!arr.length) delete S.log[k];
  save();
  return i<0;
}
function streak(h){
  let d = today(), n = 0, guard = 0;
  if(scheduled(h,d) && !isDone(h,key(d))) d = addDays(d,-1);
  while(guard++ < 2000){
    if(key(d) < h.created) break;
    if(scheduled(h,d)){ if(isDone(h,key(d))) n++; else break; }
    d = addDays(d,-1);
  }
  return n;
}
function bestStreak(h){
  let best = 0, cur = 0, d = fromKey(h.created); const t = today();
  while(d <= t){
    if(scheduled(h,d)){ if(isDone(h,key(d))){ cur++; best = Math.max(best,cur); } else if(key(d) !== key(t)) cur = 0; }
    d = addDays(d,1);
  }
  return best;
}
function dayFrac(d, only){
  const hs = S.habits.filter(h => (!only || h.id===only) && scheduled(h,d));
  if(!hs.length) return null;
  return hs.filter(h => isDone(h,key(d))).length / hs.length;
}
const totalChecks = () => Object.values(S.log).reduce((a,b)=>a+b.length,0);
const maxStreak = () => Math.max(0, ...S.habits.map(streak));
function rateOver(days, pick){
  let s=0, dn=0; const t = today();
  for(let i=1;i<=days;i++){ const d = addDays(t,-i); S.habits.forEach(h=>{ if(pick(h,d) && scheduled(h,d)){ s++; if(isDone(h,key(d))) dn++; } }); }
  return s ? dn/s : null;
}
function weekdayStats(days, only){
  return DOW.map((_,w) => rateOver(days, (h,d) => dowIdx(d)===w && (!only || h.id===only)));
}
function checkBadges(silent){
  const ms = maxStreak(), tot = totalChecks();
  BADGES.forEach((b,i)=>{
    const got = b.n ? ms >= b.n : tot >= b.tot;
    if(got && !S.earned.includes(i)){ S.earned.push(i); save(); if(!silent){ toast(`New reward unlocked: ${b.t}`); confetti(); } }
  });
}

function friendly(ex){
  const c = ex && ex.code || '';
  if(/invalid-credential|wrong-password|user-not-found/.test(c)) return 'Wrong email or password.';

  if(/popup-closed/.test(c)) return 'Sign-in was cancelled.';
  if(/network/.test(c)) return 'No connection. Try again.';
  return (ex && ex.message) || 'Something went wrong.';
}

      <div class="big">${done} of ${todays.length} done</div>
      <div class="muted">${todays.length && done===todays.length ? 'Perfect day. Nice work.' : 'Keep the chain going today.'}</div>
      <div class="streakline">${I('flame')} ${ms}-day best active streak</div>

          <div class="hinfo"><div class="hname">${esc(h.name)}</div>
            <div class="hmeta"><span>${I('flame')}${st}</span>${S.reminders&&h.time?`<span>${I('bell')}${h.time}</span>`:''}${sch?'':'<span>Rest day</span>'}</div></div>
          <button class="edit" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}">${I('more')}</button>

      });

  $('#view').querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>habitForm(null, SUGGESTIONS[+b.dataset.sug]));
  $('#addH').onclick = ()=>{
    if(!S.premium && S.habits.length >= FREE_LIMIT){ paywall('The free plan includes 3 habits. Upgrade for unlimited habits.'); return; }

}

// ----- Calendar -----
function levelClass(f){ if(f==null) return ''; if(f===0) return 'miss'; if(f<.5) return 'l1'; if(f<.75) return 'l2'; if(f<1) return 'l3'; return 'l4'; }
function viewCal(){
  const t = today(), y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1), nDays = new Date(y,m+1,0).getDate();
  let html = `<div class="card"><div class="calhead"><button class="iconbtn" id="prevM" aria-label="Previous month">${I('left')}</button>
    <h2 style="margin:0">${MONTHS[m]} ${y}</h2><button class="iconbtn" id="nextM" aria-label="Next month">${I('right')}</button></div>
    ${S.habits.length>1?`<div class="chips"><button class="chip ${!calFilter?'on':''}" data-f="">All habits</button>
    ${S.habits.map(h=>`<button class="chip ${calFilter===h.id?'on':''}" data-f="${h.id}">${esc(h.name)}</button>`).join('')}</div>`:''}
    <div class="grid7">${DOW.map(d=>`<div class="dow">${d[0]}</div>`).join('')}`;
  for(let i=0;i<dowIdx(first);i++) html += `<div class="day blank"></div>`;
  let full=0, past=0;
  for(let d=1; d<=nDays; d++){
    const dt = new Date(y,m,d), k = key(dt);
    const fut = dt > t, f = fut ? null : dayFrac(dt, calFilter);
    let cls = fut ? 'future' : (k===key(t) && f===0) ? '' : levelClass(f);
    if(k===key(t)) cls += ' today';
    if(!fut && f!=null){ past++; if(f===1) full++; }
    const hs = S.habits.filter(h=>(!calFilter||h.id===calFilter)&&scheduled(h,dt));
    const tipTxt = fut ? `${MONTHS[m]} ${d}` : f==null ? `${MONTHS[m]} ${d}: nothing scheduled` : `${MONTHS[m]} ${d}: ${hs.filter(h=>isDone(h,k)).length}/${hs.length} done`;
    html += `<button class="day ${cls}" data-day="${k}" data-tip="${tipTxt}" ${fut?'disabled':''}>${d}</button>`;
  }
  html += `</div><div class="legend"><i style="background:var(--miss)"></i>Missed &nbsp; <i style="background:var(--a1)"></i><i style="background:var(--a2)"></i><i style="background:var(--a3)"></i>Partly &nbsp; <i style="background:var(--a4)"></i>All done</div></div>
    <div class="card kpis">
      <div class="kpi"><b>${full}</b><span>Perfect days</span></div>
      <div class="kpi"><b>${past?Math.round(full/past*100):0}%</b><span>Of this month</span></div>
      <div class="kpi"><b>${totalChecks()}</b><span>Total check-ins</span></div>
    </div>
    <p class="muted" style="text-align:center">Tap a day to edit what you completed.</p>`;
  $('#view').innerHTML = html;
  $('#prevM').onclick=()=>{ calMonth = new Date(y,m-1,1); render(); };
  $('#nextM').onclick=()=>{ calMonth = new Date(y,m+1,1); render(); };
  $('#view').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ calFilter=b.dataset.f||null; render(); });
  $('#view').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>dayEditor(b.dataset.day));
}
function dayEditor(k){
  const d = fromKey(k);
  const hs = S.habits.filter(h=>scheduled(h,d));
  openSheet(`<h2>${fmtDate(d)}</h2>
    <div class="list" style="margin-top:14px">${hs.length? hs.map(h=>`<div class="habit">${markHtml(h)}<div class="hinfo"><div class="hname">${esc(h.name)}</div></div>
    <button class="check ${isDone(h,k)?'on':''}" data-dc="${h.id}">${I('check')}</button></div>`).join('') : '<div class="empty">Nothing scheduled this day.</div>'}</div>
    <button class="primary" id="dclose">Done</button>`);
  $('#sheet').querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{ toggle(S.habits.find(h=>h.id===b.dataset.dc),k); b.classList.toggle('on'); });
  $('#dclose').onclick=()=>{ closeSheet(); render(); checkBadges(); };
}

// ----- Stats -----
function barChart(vals, worst){
  return `<div class="bars">${vals.map((v,i)=>`<div class="bar ${i===worst?'worst':''}" data-tip="${DOW_LONG[i]}: ${v==null?'no data':pct(v)+' done'}">
    <div class="v">${pct(v)}</div><div class="b" style="height:${v==null?0:Math.max(2,v*100)}%"></div><div class="l">${DOW[i]}</div></div>`).join('')}</div>`;
}
function trendChart(){
  const t = today(), pts = [];
  for(let i=29;i>=0;i--){
    let s=0,dn=0;
    for(let j=0;j<7;j++){ const d=addDays(t,-i-j); if(key(d)===key(t)) continue; S.habits.forEach(h=>{ if(scheduled(h,d)){ s++; if(isDone(h,key(d))) dn++; } }); }
    pts.push({d:addDays(t,-i), v: s? dn/s : 0});
  }
  const W=480,H=150,L=32,R=8,T=10,B=22, x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>T+(1-v)*(H-T-B);
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = path + `L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const grid = [0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v*100}%</text>`).join('');
  const short = d => `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
  const hits = pts.map((p,i)=>`<rect x="${x(i)-8}" y="${T}" width="16" height="${H-T-B}" fill="transparent" data-tip="${short(p.d)}: ${pct(p.v)} (7-day avg)"/>`).join('');
  const lab = [0,14,29].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===29?'end':'middle'}" font-size="10" fill="var(--muted)">${short(pts[i].d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px">${grid}<path d="${area}" fill="var(--a1)" opacity=".7"/><path d="${path}" fill="none" stroke="var(--a4)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].v)}" r="4" fill="var(--a4)" stroke="var(--card)" stroke-width="2"/>${lab}${hits}</svg>`;
}
function viewStats(){
  if(!S.habits.length){ $('#view').innerHTML = `<div class="card"><h2>No data yet</h2><div class="muted">Add a habit and check it off for a few days to see your stats.</div></div>`; return; }
  const vals = weekdayStats(56, statFilter);
  let worst=-1, wv=2, best=-1, bv=-1;
  vals.forEach((v,i)=>{ if(v!=null && v<wv){wv=v;worst=i;} if(v!=null && v>bv){bv=v;best=i;} });
  const known = vals.filter(v=>v!=null), mean = known.length ? known.reduce((a,b)=>a+b,0)/known.length : 0;
  let html = `<div class="card"><h2>Where do you slip?</h2><div class="muted">Completion rate by weekday · last 8 weeks</div>
    ${S.habits.length>1?`<div class="chips" style="margin-top:14px"><button class="chip ${!statFilter?'on':''}" data-sf="">All</button>
    ${S.habits.map(h=>`<button class="chip ${statFilter===h.id?'on':''}" data-sf="${h.id}">${esc(h.name)}</button>`).join('')}</div>`:''}
    ${barChart(vals, known.length && mean-wv>.1 ? worst : -1)}
    ${!known.length ? '<div class="insight good">'+I('ok')+'<div>Check off your habits for a few days to see patterns.</div></div>'
      : worst>=0 && mean-wv>.1 ? `<div class="insight">${I('alert')}<div><b>${DOW_LONG[worst]}s</b> are your weakest day – ${pct(wv)} done vs. ${pct(mean)} on average. Try moving the reminder or making the habit smaller that day.</div></div>`
      : `<div class="insight good">${I('ok')}<div>You're consistent all week. Best day: <b>${DOW_LONG[best]}</b>.</div></div>`}
    <details><summary>Show as table</summary><table class="tbl"><tr><th>Weekday</th><th>Done</th></tr>${vals.map((v,i)=>`<tr><td>${DOW_LONG[i]}</td><td>${pct(v)}</td></tr>`).join('')}</table></details>
  </div>`;
  const ms = maxStreak(), tot = totalChecks();
  html += `<div class="card"><h2>Rewards</h2><div class="muted">Earn badges for streaks and check-ins.</div><div class="badges">${BADGES.map(b=>{
    const got = b.n ? ms>=b.n : tot>=b.tot;
    const prog = b.n ? `${Math.min(ms,b.n)}/${b.n}` : `${Math.min(tot,b.tot)}/${b.tot}`;
    return `<div class="badge ${got?'got':''}" data-tip="${b.t} · ${prog}"><div class="ic">${got?I('check'):(b.n||b.tot)}</div>${b.t}</div>`;}).join('')}</div></div>`;
  const detailed = `<h2>Trend</h2><div class="muted">Completion rate, 7-day rolling average · 30 days</div>${trendChart()}
    <h2 style="margin-top:22px">By habit · 30 days</h2>
    ${S.habits.map(h=>{const r=rateOver(30,x=>x.id===h.id); return `<div class="hbar" data-tip="${esc(h.name)}: ${pct(r)} · best streak ${bestStreak(h)}"><span class="nm">${esc(h.name)}</span><div class="track"><div class="fill" style="width:${(r||0)*100}%"></div></div><b>${pct(r)}</b></div>`;}).join('')}
    <h2 style="margin-top:22px">By time of day · 30 days</h2>
    ${PARTS.map(p=>{const r=rateOver(30,h=>h.part===p.id); return `<div class="hbar"><span class="nm">${p.name}</span><div class="track"><div class="fill" style="width:${(r||0)*100}%"></div></div><b>${pct(r)}</b></div>`;}).join('')}`;
  html += S.premium ? `<div class="card">${detailed}</div>` :
    `<div class="card locked"><div class="blur">${detailed}</div><div class="lockmsg"><div>${I('lock')}<div style="font-weight:600;margin-top:6px">Detailed charts</div><div class="muted" style="margin:4px 0 12px">Trends, streak history and time of day</div><button class="pill gold" id="unlockG">${I('star')}Unlock with Premium</button></div></div></div>`;
  $('#view').innerHTML = html;
  $('#view').querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{ statFilter=b.dataset.sf||null; render(); });
  const u = $('#unlockG'); if(u) u.onclick=()=>paywall();
}

// ================= habit form =================
function habitForm(h, preset){
  const isNew = !h;
  const used = S.habits.map(x=>x.color);
  const f = h ? JSON.parse(JSON.stringify(h)) :
    Object.assign({name:'', color: COLORS.find(c=>!used.includes(c)) || COLORS[S.habits.length % COLORS.length], part:'morning', time:'08:00', days:[0,1,2,3,4,5,6]}, preset||{});
  openSheet(`<h2>${isNew?'New habit':'Edit habit'}</h2>
    <label for="fName">Name</label><input type="text" id="fName" maxlength="40" placeholder="e.g. Drink water, read, exercise" value="${esc(f.name)}">
    <label>Color</label><div class="colors">${COLORS.map(c=>`<button data-c="${c}" class="${f.color===c?'on':''}" style="background:${c}" aria-label="Color"></button>`).join('')}</div>

    <label for="fTime">Reminder</label><input type="time" id="fTime" value="${f.time||''}">
    <button class="primary" id="fSave">${isNew?'Create habit':'Save'}</button>
    ${isNew?'':'<button class="ghost danger" id="fDel">Delete habit</button>'}
    <button class="ghost" id="fCancel">Cancel</button>`);
  const sh = $('#sheet');
  sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ f.color=b.dataset.c; sh.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b)); });
  sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ f.part=b.dataset.p; sh.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b)); });
  sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.d; f.days = f.days.includes(i)? f.days.filter(x=>x!==i) : [...f.days,i].sort(); b.classList.toggle('on'); });
  $('#fCancel').onclick=closeSheet;

    f.name = $('#fName').value.trim(); f.time = $('#fTime').value;
    if(!f.name){ $('#fName').focus(); $('#fName').style.borderColor='var(--missInk)'; return; }
    if(!f.days.length){ toast('Pick at least one day'); return; }
    if(isNew){
      if(!S.premium && S.habits.length >= FREE_LIMIT){ closeSheet(); paywall('The free plan includes 3 habits. Upgrade for unlimited habits.'); return; }
      f.id='h'+Date.now(); f.created=key(today()); S.habits.push(f); toast(`"${f.name}" created`); askNotif();
    } else Object.assign(h, f);
    save(); closeSheet(); render();
  };
  const del=$('#fDel'); if(del) del.onclick=()=>{
    S.habits = S.habits.filter(x=>x.id!==h.id);
    Object.keys(S.log).forEach(k=>{ S.log[k]=S.log[k].filter(id=>id!==h.id); if(!S.log[k].length) delete S.log[k]; });
    save(); closeSheet(); render(); toast('Habit deleted');
  };
}

      <tr><td>Habits</td><td>3</td><td>Unlimited</td></tr>
      <tr><td>Calendar, streaks, rewards</td><td>✓</td><td>✓</td></tr>
      <tr><td>Reminders</td><td>✓</td><td>✓</td></tr>
      <tr><td>Weekday stats</td><td>✓</td><td>✓</td></tr>
      <tr><td>Detailed charts</td><td>–</td><td>✓</td></tr>
      <tr><td>Widgets</td><td>–</td><td>✓</td></tr>
      <tr><td>Themes</td><td>1</td><td>5</td></tr></table>
    <button class="primary" id="buy">Start Premium · ${plan==='year'?'DKK 149/year':'DKK 25/month'}</button>
    <button class="ghost" id="later">Not now</button>
    <div class="demo">Prototype: no payment is taken – this just unlocks Premium.</div>`);
    $('#sheet').querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ plan=b.dataset.plan; draw(); });
    $('#buy').onclick=()=>{ S.premium=true; S.plan=plan; save(); closeSheet(); render(); toast('Welcome to Premium'); confetti(); };
    $('#later').onclick=closeSheet;
  };
  draw();
}

// ================= reminders =================
function askNotif(){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(()=>{}); }catch(e){} }
function tick(){
  if(!S || !S.reminders) return;
  const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, k = key(today());
  S.habits.forEach(h=>{
    if(h.time!==hm || !scheduled(h,today()) || isDone(h,k)) return;
    const fk = k+h.id; if(S.fired[fk]) return;
    S.fired = Object.fromEntries(Object.entries(S.fired).filter(([x])=>x.startsWith(k))); S.fired[fk] = 1; save();
    const msg = `Time for: ${h.name}`;
    toast(msg);
    try{ if('Notification' in window && Notification.permission==='granted') new Notification('Habitry', {body: msg, icon:'icons/icon-192.png'}); }catch(e){}
  });
}
setInterval(tick, 20000);

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
Auth.init();
})();
</script>
